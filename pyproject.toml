[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-health-agent"
version = "0.2.0"
description = "Observable health analysis agents with typed Skills, local RAG and source-bound report review"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.32,<1",
  "python-multipart>=0.0.20,<1", "pandas>=2.2,<3", "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2", "lightgbm>=4.5,<5", "matplotlib>=3.9,<4", "joblib>=1.4,<2",
  "httpx>=0.27,<1",
  "qdrant-client>=1.19,<2",
  "PyYAML>=6.0.2,<7",
  "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "build>=1.2,<2"]
ui = ["streamlit>=1.41,<2"]

[project.scripts]
smarthealth-api = "smarthealth.cli.serve:main"
smarthealth-ui = "smarthealth.cli.ui:main"
smarthealth-generate = "smarthealth.cli.generate_demo_data:main"
smarthealth-train = "smarthealth.cli.train:main"
smarthealth-index = "smarthealth.cli.build_knowledge_index:main"
smarthealth-eval = "smarthealth.evaluation.run_eval:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smarthealth*"]

[tool.setuptools.package-data]
"smarthealth.resources" = ["configs/*.yaml", "configs/*.json", "configs/report/*.yaml", "knowledge/*.json", "knowledge/*.md", "data/sample/*.csv", "evaluation/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
