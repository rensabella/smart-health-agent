name: checks
on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEALTH_MEMORY_MODE: ephemeral
      HEALTH_RAG_MODE: disabled
      HEALTH_AGENT_BACKEND: disabled
      MPLCONFIGDIR: /tmp/smarthealth-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: python -m pip install -e '.[dev,ui]'
      - run: python -m pip check
      - run: ruff check src app skills scripts evaluation frontend tests examples train.py generate_demo_data.py
      - run: ruff format --check src app skills scripts evaluation frontend tests examples train.py generate_demo_data.py
      - run: python -m pytest
      - run: python -m build --wheel
      - run: python scripts/check_wheel.py --wheel dist/smart_health_agent-0.2.0-py3-none-any.whl
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag smart-health-agent:ci .
